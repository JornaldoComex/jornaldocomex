<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jornal do Comex</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #f4f6f9;
  color: #1f2937;
}

header {
  background: linear-gradient(135deg, #0f4c81, #0b355a);
  color: #fff;
  padding: 24px;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin-top: 6px;
  opacity: 0.9;
}

.container {
  padding: 24px;
  max-width: 1200px;
  margin: auto;
}

.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.controls input,
.controls select {
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #d1d5db;
  font-size: 14px;
  width: 100%;
  max-width: 260px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  cursor: pointer;
  transition: all 0.2s ease;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 24px rgba(0,0,0,0.12);
}

.card h3 {
  margin: 0 0 8px;
  font-size: 18px;
}

.card p {
  font-size: 14px;
  color: #4b5563;
}

.tag {
  display: inline-block;
  margin-top: 10px;
  padding: 4px 10px;
  font-size: 12px;
  border-radius: 20px;
  background: #e0ecf8;
  color: #0f4c81;
  font-weight: 600;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: #fff;
  max-width: 600px;
  width: 100%;
  border-radius: 12px;
  padding: 24px;
}

.modal-content h2 {
  margin-top: 0;
}

.modal-content button {
  margin-top: 20px;
  padding: 10px 14px;
  border: none;
  border-radius: 6px;
  background: #0f4c81;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 16px;
  font-size: 13px;
  color: #6b7280;
}
</style>
</head>

<body>

<header>
  <h1>Jornal do Comex</h1>
  <p>Informação estratégica para comércio exterior</p>
</header>

<main class="container">

  <div class="controls">
    <input type="text" id="search" placeholder="Buscar notícia">
    <select id="category">
      <option value="todas">Todas as categorias</option>
      <option value="importacao">Importação</option>
      <option value="exportacao">Exportação</option>
      <option value="tributacao">Tributação</option>
      <option value="logistica">Logística</option>
    </select>
  </div>

  <div class="grid" id="newsGrid"></div>

</main>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <button id="closeModal">Fechar</button>
  </div>
</div>

<footer>
  © Jornal do Comex
</footer>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const noticias = [
    {
      titulo: "Mudanças na tributação de importação",
      texto: "Novas regras impactam diretamente empresas que utilizam benefícios fiscais.",
      categoria: "tributacao"
    },
    {
      titulo: "Aumento no fluxo portuário em 2026",
      texto: "Portos brasileiros registram crescimento expressivo no primeiro trimestre.",
      categoria: "logistica"
    },
    {
      titulo: "Exportações brasileiras batem recorde",
      texto: "Setor de commodities lidera crescimento nas vendas externas.",
      categoria: "exportacao"
    },
    {
      titulo: "Facilitação aduaneira em pauta",
      texto: "Novas propostas prometem reduzir burocracia nos processos.",
      categoria: "importacao"
    }
  ];

  const grid = document.getElementById("newsGrid");
  const search = document.getElementById("search");
  const category = document.getElementById("category");
  const modal = document.getElementById("modal");

  function render() {
    grid.innerHTML = "";

    const termo = search.value.toLowerCase();
    const cat = category.value;

    noticias
      .filter(n =>
        (cat === "todas" || n.categoria === cat) &&
        n.titulo.toLowerCase().includes(termo)
      )
      .forEach(n => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <h3>${n.titulo}</h3>
          <p>${n.texto.substring(0, 80)}...</p>
          <span class="tag">${n.categoria}</span>
        `;
        card.addEventListener("click", () => openModal(n));
        grid.appendChild(card);
      });
  }

  function openModal(noticia) {
    document.getElementById("modalTitle").innerText = noticia.titulo;
    document.getElementById("modalText").innerText = noticia.texto;
    modal.classList.add("active");
  }

  document.getElementById("closeModal").addEventListener("click", () => {
    modal.classList.remove("active");
  });

  search.addEventListener("input", render);
  category.addEventListener("change", render);

  render();

});
</script>

</body>
</html>
